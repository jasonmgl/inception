services:
  adminer:
    build: ./requirements/adminer
    container_name: adminer
    expose:
      - 9000
    networks:
      - docker-network
    restart: always
  redis:
    build: ./requirements/redis
    container_name: redis
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - docker-network
    restart: always
  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - WORDPRESS_DB_HOST=${MARIADB_HOST}
      - WORDPRESS_DB_NAME=${MARIADB_NAME}
      - WORDPRESS_DB_USER=${MARIADB_USER}
      - WORDPRESS_DB_PASSWORD=${MARIADB_USER_PASSWORD}
    volumes:
      - wordpress:/var/www/html
    expose:
      - 9000
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - docker-network
    restart: always
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    env_file:
      - .env
    volumes:
      - mariadb:/var/lib/mysql
    expose:
      - 3306
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - docker-network
    restart: always
  nginx:
    build: ./requirements/nginx
    container_name: nginx
    env_file:
      - .env
    depends_on:
      wordpress:
        condition: service_healthy
      adminer:
        condition: service_started
    volumes:
      - wordpress:/var/www/html
    ports:
      - 443:443
    networks:
      - docker-network
    restart: always
  ftp:
    build: ./requirements/ftp
    container_name: ftp
    ports:
      - "20-21:20-21"
      - "65500-65515:65500-65515"
    env_file:
      - .env
    environment:
      - FTP_USER=${FTP_USER}
      - FTP_PASS=${FTP_PASS}
    volumes:
        - wordpress:/inception/ftp
        - /var/log/vsftpd:/var/log/vsftpd
    networks:
      - docker-network
    restart: always
  fail2ban:
    build: ./requirements/fail2ban
    container_name: fail2ban
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - ftp
      - nginx
    volumes:
      - /var/log/vsftpd:/var/log/vsftpd
    networks:
      - docker-network
    restart: always

volumes:
  wordpress:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /inception/data/wp
  mariadb:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /inception/data/db

networks:
  docker-network:
    driver: bridge
